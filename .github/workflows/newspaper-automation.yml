name: BBCC Skill Hub Newspaper & Option 3 AI Reel Automation

on:
  schedule:
    # Runs every 10 minutes from 00:20 UTC to 13:00 UTC (05:50 AM to 06:30 PM IST)
    - cron: '*/10 0-13 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in Dry-Run mode? (false to post live)'
        required: false
        default: 'false'
      force_run:
        description: 'Force run even outside active hours?'
        required: false
        default: 'true'

permissions:
  contents: write

concurrency:
  group: bbcc-newspaper-runner
  cancel-in-progress: false

jobs:
  publish-newspaper-and-reel:
    name: Generate Newspaper Poster & Option 3 AI Voice Reel
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install System FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Daily News & Option 3 Reel Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CREATOR_HANDLE: ${{ secrets.CREATOR_HANDLE || '@rauth_jee' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          FORCE_RUN: ${{ inputs.force_run || 'false' }}
        run: |
          python main.py

      - name: Commit and Push Updated History
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/posted_topics.json output/sector_history.json output/story_history.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Auto-post history update $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST') [skip ci]" || true
            git pull --rebase --autostash origin main || true
            git push origin main || true
          else
            echo "No history changes to commit."
          fi
