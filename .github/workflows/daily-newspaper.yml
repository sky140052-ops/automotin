name: BBCC Skill Hub Newspaper & Option 3 AI Reel Automation

on:
  schedule:
    # India Standard Time: 06:00, 10:00, 14:00, 18:00
    - cron: '30 0 * * *'
    - cron: '30 4 * * *'
    - cron: '30 8 * * *'
    - cron: '30 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bbcc-newspaper-runner
  cancel-in-progress: false

jobs:
  publish-newspaper-and-reel:
    name: Generate Newspaper Poster & Option 3 AI Voice Reel
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install System FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Daily News & Option 3 Reel Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CREATOR_HANDLE: ${{ secrets.CREATOR_HANDLE || '@rauth_jee' }}
          # Generate and upload assets only; social publishing requires approval.
          DRY_RUN: 'true'
          FORCE_RUN: 'true'
        run: |
          python main.py

      - name: Commit and Push Updated History
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add output/posted_topics.json output/sector_history.json output/story_history.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Auto-post history update $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST') [skip ci]"
            git push origin main
          else
            echo "No history changes to commit."
          fi
