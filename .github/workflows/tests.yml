name: BBCC Automation Tests

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Hindi fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python files
        run: python -m py_compile bbcc_news_bot.py tests/test_news_bot.py
      - name: Run smoke tests
        run: python -m unittest discover -s tests -v
