name: BBCC Skill Hub Breaking News & Reels Automation Bot

on:
  # Automated Schedule: Runs every 15 minutes between 06:00 AM IST and 06:00 PM IST (~50 Reels/day)
  schedule:
    - cron: '30,45 0 * * *'
    - cron: '*/15 1-11 * * *'
    - cron: '0,15,30 12 * * *'

  # Manual Trigger Button in GitHub Actions Tab & External Webhook
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in Dry-Run mode? (Generates media without posting)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  generate-and-publish:
    name: Generate Hindi Tip & Multi-Format Publish (Post + Story + Reel)
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Repository
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Setup Python 3.11 Runtime
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Install Python Dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Run Automation Pipeline
      - name: Execute Multi-Format Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CREATOR_HANDLE: ${{ secrets.CREATOR_HANDLE || '@rauth_jee' }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          python main.py

      # 5. Save & Upload Generated Media Artifacts
      - name: Upload Media Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-hindi-cyber-media
          path: |
            output/daily_tip.png
            output/daily_reel.mp4
          retention-days: 7
