name: Daily Cyber Security Social Media Bot

on:
  # Automated 24/7 Daily Schedule (04:30 UTC = 10:00 AM IST)
  schedule:
    - cron: '30 4 * * *'

  # Manual Trigger Button in GitHub Actions Tab
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in Dry-Run mode? (Generates image without posting)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  generate-and-publish:
    name: Generate Cyber Tip & Publish to Meta
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Python 3.11 Runtime
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Install System Fonts for High-Quality Visual Typography
      - name: Install System Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core fonts-liberation

      # 4. Install Python Dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 5. Run Automation Pipeline
      - name: Execute Daily Social Media Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          CREATOR_HANDLE: ${{ secrets.CREATOR_HANDLE || '@CyberSecurityIntel' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          python main.py

      # 6. Save & Upload Generated Graphic as Workflow Artifact
      - name: Upload Daily Graphic Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-cyber-graphic
          path: output/daily_tip.png
          retention-days: 7
