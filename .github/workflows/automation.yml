name: BBCC Skill Hub Daily AI News Automation

on:
  schedule:
    # 08:00 India Standard Time (02:30 UTC), once daily
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Generate poster/reel only; do not publish'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

concurrency:
  group: bbcc-daily-news
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Restore publication history
        uses: actions/cache/restore@v4
        with:
          path: output/state.json
          key: bbcc-news-state-${{ github.run_id }}
          restore-keys: |
            bbcc-news-state-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate required configuration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          DRY_RUN_INPUT: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
        run: |
          test -n "$GEMINI_API_KEY" || (echo "::error::Add GEMINI_API_KEY in repository Actions secrets"; exit 1)
          if [ "$DRY_RUN_INPUT" != "true" ]; then
            test -n "$FB_ACCESS_TOKEN" || (echo "::error::FB_ACCESS_TOKEN is required for live publishing"; exit 1)
            test -n "$FB_PAGE_ID" || (echo "::error::FB_PAGE_ID is required for live publishing"; exit 1)
          fi

      - name: Generate news poster and reel
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
        run: python bbcc_news_bot.py

      - name: Save publication history
        if: success() && github.event_name == 'schedule' && hashFiles('output/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: output/state.json
          key: bbcc-news-state-${{ github.run_id }}

      - name: Upload generated media and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bbcc-skill-hub-daily-news
          path: |
            output/daily_tip.png
            output/daily_reel.mp4
            output/daily_story.json
            output/state.json
          if-no-files-found: warn
          retention-days: 14
