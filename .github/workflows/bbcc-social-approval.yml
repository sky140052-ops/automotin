name: BBCC Newspaper Approval Queue

on:
  schedule:
    # India Standard Time: 06:00, 10:00, 14:00, 18:00
    - cron: "30 0 * * *"
    - cron: "30 4 * * *"
    - cron: "30 8 * * *"
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  create-post-request:
    runs-on: ubuntu-latest
    steps:
      - name: Create approval request
        uses: actions/github-script@v7
        with:
          script: |
            const now = new Date();
            const ist = new Date(now.getTime() + 330 * 60 * 1000);
            const stamp = ist.toISOString().replace('T', ' ').slice(0, 16);
            const date = ist.toISOString().slice(0, 10);
            const hour = ist.getUTCHours();
            const slot = hour < 10 ? 'सुबह 6 बजे' : hour < 14 ? 'सुबह 10 बजे' : hour < 18 ? 'दोपहर 2 बजे' : 'शाम 6 बजे';
            const title = '📰 BBCC समाचार अनुमोदन: ' + date + ' — ' + slot;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            if (existing.data.some(i => i.title === title)) {
              core.info('Approval request already exists; skipping duplicate.');
              return;
            }
            const body = [
              '## BBCC Skill Hub समाचार संस्करण की जाँच',
              '',
              '- **समय (IST):** ' + slot,
              '- **अनुरोध बनाया गया:** ' + stamp + ' IST',
              '- **स्थिति:** समीक्षा की प्रतीक्षा',
              '',
              '### आपकी अनुमति',
              '1. GitHub Actions में इसी समय का newspaper run पूरा हुआ है या नहीं, जाँचें।',
              '2. output/daily_newspaper.png और उपलब्ध समाचार/स्रोत लिंक जाँचें।',
              '3. सब सही होने पर इस Issue पर OK टिप्पणी करें; गलती हो तो HOLD लिखें।',
              '',
              '> यह Issue समीक्षा/अनुमति माँगता है। यह अपने-आप Facebook या Instagram पर पोस्ट प्रकाशित नहीं करता।',
              '',
              '### संस्करण',
              'BAL BHARTI COACHING CENTER / BBCC Skill Hub — बिहार समाचार, सरकारी नौकरी और शिक्षा अपडेट।'
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: []
            });